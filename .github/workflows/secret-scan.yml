# GitGuardian Secret Scanning
# Scans for accidentally committed secrets (API keys, passwords, etc.)

name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitguardian:
    name: GitGuardian Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for scanning

      - name: GitGuardian scan
        uses: GitGuardian/ggshield-action@v1
        env:
          # Get your API key from https://dashboard.gitguardian.com/
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        continue-on-error: true  # Don't fail builds until key is set up

      # Alternative: Use gitleaks if GitGuardian isn't set up
      - name: Gitleaks scan (backup)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
