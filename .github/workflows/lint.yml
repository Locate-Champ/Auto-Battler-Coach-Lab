# Frontend build + Python lint/format (full codebase)
# Runs on all PRs and pushes to main

name: Lint & Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./app/frontend

      - name: Build frontend
        run: npm run build
        working-directory: ./app/frontend

  # Lint the full Python codebase with ruff
  python-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint (full codebase)
        run: ruff check .

      - name: Ruff format check (full codebase)
        run: ruff format --check .
