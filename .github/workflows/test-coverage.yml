# Test and coverage reporting with Codecov
# Runs tests and uploads coverage reports

name: Tests & Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./app
        continue-on-error: true

      - name: Run tests with coverage
        run: npm test -- --coverage --watchAll=false
        working-directory: ./app
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          # Get your token from https://codecov.io
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./app/coverage
          flags: unittests
          name: tft-coach-coverage
          fail_ci_if_error: false
          verbose: true

  # Python tests (if any)
  python-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install pytest pytest-cov

      - name: Run Python tests
        run: pytest scripts/ -v --cov=scripts --cov-report=xml
        continue-on-error: true

      - name: Upload Python coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: python
          fail_ci_if_error: false
