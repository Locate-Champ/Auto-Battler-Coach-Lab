# Tests (frontend build + python unit tests + regression gates)

name: Tests & Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./app/frontend

      - name: Build frontend
        run: npm run build
        working-directory: ./app/frontend

  # Full Python test suite
  python-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Dual-track guard (PR only)
        if: github.event_name == 'pull_request'
        run: python scripts/ci/check_dual_track_guard.py

      - name: Verify public surface allowlist
        run: python scripts/ci/check_public_surface_allowlist.py

      - name: Ensure CLAUDE.md matches AGENTS.md
        run: python scripts/sync_agents_to_claude.py --check

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-simulator.txt
          python -m pip install pytest pytest-timeout

      - name: Run full test suite
        run: |
          python -m pytest tests/ simulator/test_item_combat.py \
            -x --timeout=120 -q \
            --ignore=tests/test_data_loader.py \
            --ignore=tests/test_dataset_streaming.py \
            --ignore=tests/test_embeddings.py \
            --ignore=tests/test_feature_engineering.py \
            --ignore=tests/test_information_theory.py \
            --ignore=tests/test_train_xgboost_external_memory.py \
            --ignore=tests/test_transformer.py \
            --ignore=tests/test_uncertainty.py \
            --ignore=tests/test_counterfactual.py \
            --ignore=tests/test_trajectory.py

  parity-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup Rust toolchain
        shell: bash
        run: |
          if command -v rustup >/dev/null 2>&1; then
            rustup toolchain install stable --profile minimal
            rustup default stable
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustc --version
          cargo --version

      - name: Install simulator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-simulator.txt maturin pytest

      - name: Run parity helper tests
        run: |
          python -m pytest tests/test_benchmark_parity_helpers.py -q

      - name: Build and install Rust engine
        run: |
          cd simulator/core/rust_engine
          maturin build --release --interpreter python
          python -m pip install target/wheels/*.whl

      - name: Run Rust-enabled combat regressions
        run: |
          python -m pytest tests/test_combat_regressions.py -q

      - name: Run parity gate
        run: |
          python -m simulator.benchmark \
            --parity-only \
            --parity-engines python,rust_full \
            --parity-layered \
            --parity-layer1-sims 40 \
            --parity-layer2-sims 40 \
            --parity-layer3-games 5 \
            --parity-focused \
            --parity-focused-sims 40 \
            --parity-sample-limit 5 \
            --parity-gate \
            --parity-gate-min-layer1-match 0.55 \
            --parity-gate-min-layer2-match 0.70 \
            --parity-gate-max-layer2-timeout 0.40 \
            --parity-gate-min-focused-mean 0.60 \
            --parity-gate-min-focused-case 0.45

  coach-eval-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run coach eval gate
        run: |
          python -m coach.offline.eval_coach \
            --eval-set outputs/coach/eval_sets/fixed_eval_set_opt_phase1_25.jsonl \
            --limit 25 \
            --output outputs/coach/eval_reports/fixed_current_opt_phase1_25.json \
            --baseline-report outputs/coach/eval_reports/fixed_baseline_opt_phase1_25.json

  cython-build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build combat_fast extension
        run: |
          python -m pip install --upgrade pip
          python -m pip install cython setuptools wheel
          cd simulator/core/combat_fast
          python setup.py build_ext --inplace

      - name: Import smoke test
        run: |
          python -c "from simulator.core.combat_fast import CYTHON_AVAILABLE, hex_distance_fast; assert CYTHON_AVAILABLE; assert hex_distance_fast(0,0,3,6) > 0"

  cython-fe-fast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build fe_fast extension
        run: |
          python -m pip install --upgrade pip
          python -m pip install cython setuptools wheel
          cd models/fe_fast
          python setup.py build_ext --inplace

      - name: Import smoke test
        run: |
          python -c "from models.fe_fast.fe_fast import team_summary_fast; print('Cython OK')"
