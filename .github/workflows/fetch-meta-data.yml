# Scheduled workflow to fetch fresh TFT data from MetaTFT API
# Runs daily at 6 AM EST to update all game data
# Syncs: /data/meta/, /data/game_data/, /simulator/data/

name: Fetch TFT Data

on:
  schedule:
    # Run daily at 6 AM EST (11 AM UTC)
    - cron: '0 11 * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      sync_target:
        description: 'What to sync'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - meta
          - game
          - simulator

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Sync TFT data
        run: |
          if [ "${{ github.event.inputs.sync_target }}" = "meta" ]; then
            python scripts/sync_all_data.py --meta
          elif [ "${{ github.event.inputs.sync_target }}" = "game" ]; then
            python scripts/sync_all_data.py --game
          elif [ "${{ github.event.inputs.sync_target }}" = "simulator" ]; then
            python scripts/sync_all_data.py --sim
          else
            python scripts/sync_all_data.py
          fi
        env:
          META_TFT_API_KEY: ${{ secrets.META_TFT_API_KEY }}
        continue-on-error: true

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain data/ simulator/data/) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ simulator/data/
          git commit -m "chore: Sync TFT data [automated]"
          git push
