<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TFT Board Preview - TFTFlows Style</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a14;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .board-container {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #2a2a3f;
    }

    .board-title {
      font-size: 14px;
      font-weight: bold;
      color: white;
      margin-bottom: 16px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    }

    .hex-grid {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hex-row {
      display: flex;
    }

    .hex-row:nth-child(even) {
      margin-left: 36px;
    }

    .hex-row:not(:first-child) {
      margin-top: -20px;
    }

    /* Unit container */
    .hex-unit {
      width: 72px;
      height: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .hex-unit:hover {
      transform: scale(1.05);
    }

    /* Item slots */
    .item-slots {
      display: flex;
      gap: 4px;
      margin-bottom: 4px;
      z-index: 10;
    }

    .item-slot {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      border: 1px solid #3a3a4f;
      overflow: hidden;
    }

    .item-slot img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .item-slot.empty {
      background: transparent;
      border: none;
    }

    /* Hexagon container */
    .hex-container {
      position: relative;
      width: 66px;
      height: 76px;
    }

    .hex-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Portrait */
    .hex-portrait {
      position: absolute;
      inset: 5px;
      overflow: hidden;
      clip-path: polygon(50% 0%, 93.3% 25%, 93.3% 75%, 50% 100%, 6.7% 75%, 6.7% 25%);
      background: #0a0a14;
    }

    .hex-portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.25);
    }

    /* Stars */
    .stars {
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2px;
      z-index: 20;
    }

    .star {
      font-size: 10px;
      color: #eab308;
      text-shadow: 0 0 4px rgba(0,0,0,1), 0 0 8px rgba(234,179,8,0.5),
                   1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    }

    .star.gold {
      color: #FFD700;
    }

    /* Champion name */
    .champ-name {
      font-size: 10px;
      color: #dce2e1;
      white-space: nowrap;
      margin-top: 4px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 0 1px transparent, 0 2px 2px rgba(0,0,0,0.8), 1px 1px 0 #000, -1px 1px 0 #000;
    }

    /* Empty hex */
    .empty-hex {
      width: 72px;
      height: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .empty-hex .spacer {
      height: 24px;
    }

    .empty-hex .hex-container {
      opacity: 0.3;
    }

    .empty-hex:hover .hex-container {
      opacity: 0.5;
    }

    /* Cost colors */
    .cost-1 { --border-color: #344049; --glow-color: rgba(52, 64, 73, 0.6); }
    .cost-2 { --border-color: #1C964D; --glow-color: rgba(28, 150, 77, 0.6); }
    .cost-3 { --border-color: #2D72B3; --glow-color: rgba(45, 114, 179, 0.6); }
    .cost-4 { --border-color: #C40C93; --glow-color: rgba(196, 12, 147, 0.6); }
    .cost-5 { --border-color: #D88810; --glow-color: rgba(216, 136, 16, 0.6); }

    /* Legend */
    .legend {
      margin-top: 30px;
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #888;
    }

    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }
  </style>
</head>
