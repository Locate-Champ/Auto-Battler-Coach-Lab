[package]
name = "tft_combat_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "tft_combat_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
arrow-array = "54"
arrow-schema = "54"
parquet = { version = "54", features = ["arrow"] }
